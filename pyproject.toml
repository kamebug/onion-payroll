[project]
name = "onion-payroll"
version = "2.50.0"
description = "Sistema de folha de pagamento para trabalhadores brasileiros no Japão"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==0.85.3",
]

[tool.flet]
org = "com.kamebug"
product = "Onion Payroll"
short_name = "OnionPayroll"
description = "Sistema de folha de pagamento para trabalhadores brasileiros no Japão"

[tool.flet.web]
base_url = "/onion-payroll"

[tool.flet.app]
path = "."
module = "main"

[tool.flet.template]
exclude = [
    "build",
    "docs",
    ".git",
    ".github",
    "__pycache__",
    "*.pyc",
    ".venv",
    "venv",
    "android",
    "ios",
    "linux",
    "macos",
    "windows",
    ".dart_tool",
    "*.lock",
    "*.orig",
]
